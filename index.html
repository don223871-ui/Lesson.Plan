<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Professional Lesson Plan">

    <title>Lesson Plan</title>


    <!-- =========================================
         MARKED.JS
         Markdown → HTML
    ========================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
    </script>


    <style>

        /* =========================================
           1. GLOBAL RESET
        ========================================== */

        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            background: #f4f6f8;

            color: #222;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            line-height: 1.75;
        }


        /* =========================================
           2. PAGE HEADER
        ========================================== */

        .site-header {

            background: white;

            border-bottom: 1px solid #e1e5e9;

            padding: 25px 20px;

            text-align: center;
        }


        .site-header h1 {

            margin: 0;

            font-size: 2rem;
        }


        .site-header p {

            margin: 6px 0 0;

            color: #666;

            font-size: 0.95rem;
        }


        /* =========================================
           3. MAIN LAYOUT
        ========================================== */

        .layout {

            display: grid;

            grid-template-columns:
                250px
                minmax(0, 900px);

            gap: 30px;

            max-width: 1250px;

            margin: 35px auto;

            padding: 0 20px;

            align-items: start;
        }


        /* =========================================
           4. TABLE OF CONTENTS
        ========================================== */

        .toc {

            position: sticky;

            top: 20px;

            background: white;

            border: 1px solid #e1e5e9;

            border-radius: 10px;

            padding: 20px;

            max-height: calc(100vh - 40px);

            overflow-y: auto;
        }


        .toc-title {

            margin-top: 0;

            margin-bottom: 15px;

            font-size: 1.05rem;

            font-weight: bold;
        }


        .toc ul {

            list-style: none;

            padding: 0;

            margin: 0;
        }


        .toc li {

            margin: 5px 0;
        }


        .toc a {

            display: block;

            padding: 5px 7px;

            color: #333;

            text-decoration: none;

            border-radius: 5px;

            font-size: 0.9rem;
        }


        .toc a:hover {

            background: #f0f2f5;
        }


        .toc .toc-h3 {

            padding-left: 18px;

            font-size: 0.85rem;
        }


        /* =========================================
           5. CONTENT CARD
        ========================================== */

        #content {

            min-width: 0;

            background: white;

            border: 1px solid #e1e5e9;

            border-radius: 12px;

            padding: 45px;

            overflow-wrap: break-word;
        }


        /* =========================================
           6. HEADINGS
        ========================================== */

        #content h1 {

            margin-top: 0;

            margin-bottom: 25px;

            font-size: 2.2rem;

            line-height: 1.25;
        }


        #content h2 {

            margin-top: 45px;

            margin-bottom: 18px;

            padding-bottom: 8px;

            border-bottom: 1px solid #e5e7eb;

            font-size: 1.65rem;

            line-height: 1.3;
        }


        #content h3 {

            margin-top: 30px;

            margin-bottom: 12px;

            font-size: 1.3rem;

            line-height: 1.4;
        }


        #content h4 {

            margin-top: 25px;

            font-size: 1.1rem;
        }


        /* =========================================
           7. PARAGRAPHS
        ========================================== */

        #content p {

            margin: 0 0 18px;
        }


        /* =========================================
           8. LISTS
        ========================================== */

        #content ul,
        #content ol {

            margin-top: 10px;

            margin-bottom: 20px;

            padding-left: 28px;
        }


        #content li {

            margin-bottom: 7px;
        }


        /* =========================================
           9. LINKS
        ========================================== */

        #content a {

            overflow-wrap: anywhere;
        }


        /* =========================================
           10. CODE
        ========================================== */

        #content code {

            direction: ltr;

            text-align: left;

            font-family:
                Consolas,
                "Courier New",
                monospace;

            background: #f1f3f5;

            padding: 2px 6px;

            border-radius: 4px;
        }


        #content pre {

            direction: ltr;

            text-align: left;

            overflow-x: auto;

            padding: 18px;

            margin: 20px 0;

            border-radius: 8px;

            background: #f1f3f5;
        }


        #content pre code {

            padding: 0;

            background: transparent;

            white-space: pre;
        }


        /* =========================================
           11. TABLES
        ========================================== */

        #content table {

            width: 100%;

            border-collapse: collapse;

            margin: 25px 0;

            display: block;

            overflow-x: auto;
        }


        #content th,
        #content td {

            padding: 10px 12px;

            border: 1px solid #dcdfe3;

            min-width: 120px;

            vertical-align: top;

            text-align: left;
        }


        #content th {

            font-weight: bold;

            background: #f5f6f7;
        }


        /* =========================================
           12. BLOCKQUOTE
        ========================================== */

        #content blockquote {

            margin: 22px 0;

            padding: 12px 20px;

            border-left: 4px solid #aaa;

            background: #f7f8f9;
        }


        /* =========================================
           13. IMAGES
        ========================================== */

        #content img {

            max-width: 100%;

            height: auto;

            display: block;

            margin: 20px auto;
        }


        /* =========================================
           14. LANGUAGE DIRECTION
        ========================================== */

        .rtl {

            direction: rtl;

            text-align: right;
        }


        .ltr {

            direction: ltr;

            text-align: left;
        }


        .bidi {

            unicode-bidi: plaintext;
        }


        /* =========================================
           15. LANGUAGE-SENSITIVE ELEMENTS
        ========================================== */

        #content [dir="rtl"] {

            direction: rtl;

            text-align: right;
        }


        #content [dir="ltr"] {

            direction: ltr;

            text-align: left;
        }


        /* =========================================
           16. FOOTER
        ========================================== */

        .site-footer {

            text-align: center;

            padding: 30px 20px;

            color: #777;

            font-size: 0.85rem;
        }


        /* =========================================
           17. MOBILE
        ========================================== */

        @media (max-width: 900px) {

            .layout {

                grid-template-columns: 1fr;

                margin-top: 20px;
            }


            .toc {

                position: relative;

                top: auto;

                max-height: none;

                order: -1;
            }


            #content {

                padding: 30px 24px;
            }
        }


        /* =========================================
           18. SMALL MOBILE
        ========================================== */

        @media (max-width: 600px) {

            body {

                font-size: 16px;
            }


            .site-header {

                padding: 20px 15px;
            }


            .site-header h1 {

                font-size: 1.55rem;
            }


            .layout {

                margin: 0;

                padding: 0;

                gap: 12px;
            }


            .toc {

                border-radius: 0;

                border-left: 0;

                border-right: 0;
            }


            #content {

                border-radius: 0;

                border-left: 0;

                border-right: 0;

                padding: 25px 18px;
            }


            #content h1 {

                font-size: 1.8rem;
            }


            #content h2 {

                font-size: 1.45rem;
            }


            #content h3 {

                font-size: 1.2rem;
            }
        }

    </style>

</head>


<body>


    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="site-header">

        <h1>Lesson Plan</h1>

        <p>
            Professional Lesson Plan Reader
        </p>

    </header>


    <!-- =========================================
         MAIN LAYOUT
    ========================================== -->

    <div class="layout">


        <!-- =====================================
             TABLE OF CONTENTS
        ====================================== -->

        <nav
            id="toc"
            class="toc"
            aria-label="Table of Contents">

            <div class="toc-title">
                Contents
            </div>

            <div id="toc-list">
                Loading...
            </div>

        </nav>


        <!-- =====================================
             MAIN CONTENT
        ====================================== -->

        <main id="content">

            Loading...

        </main>


    </div>


    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="site-footer">

        Lesson Plan · GitHub Pages

    </footer>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script>


        /* =====================================
           MARKDOWN FILE
        ====================================== */

        const markdownFile = "Lesson%20Plan.md";


        /* =====================================
           LANGUAGE DETECTION
        ====================================== */

        function containsPersian(text) {

            return /[\u0600-\u06FF]/.test(text);

        }


        /* =====================================
           APPLY TEXT DIRECTION
        ====================================== */

        function applyDirection(root) {

            const elements = root.querySelectorAll(
                "p, li, blockquote, h1, h2, h3, h4, h5, h6, td, th"
            );


            elements.forEach(element => {

                const text =
                    element.textContent.trim();


                if (!text) {
                    return;
                }


                /*
                 * Skip code
                 */

                if (
                    element.closest("pre") ||
                    element.tagName === "CODE"
                ) {

                    element.dir = "ltr";

                    return;
                }


                /*
                 * Persian / Arabic script
                 */

                if (containsPersian(text)) {

                    element.dir = "rtl";

                }

                /*
                 * English / Latin script
                 */

                else {

                    element.dir = "ltr";

                }

            });

        }


        /* =====================================
           CREATE SAFE ID
        ====================================== */

        function createSlug(text) {

            return text
                .toLowerCase()
                .trim()
                .replace(/[^\w\s-]/g, "")
                .replace(/\s+/g, "-")
                .replace(/-+/g, "-");

        }


        /* =====================================
           CREATE TABLE OF CONTENTS
        ====================================== */

        function generateTOC() {

            const content =
                document.getElementById("content");


            const tocList =
                document.getElementById("toc-list");


            const headings =
                content.querySelectorAll(
                    "h1, h2, h3"
                );


            if (!headings.length) {

                tocList.innerHTML =
                    "<p>No sections found.</p>";

                return;
            }


            const ul =
                document.createElement("ul");


            headings.forEach((heading, index) => {

                let id =
                    createSlug(
                        heading.textContent
                    );


                /*
                 * Guarantee unique ID
                 */

                if (!id) {

                    id = "section-" + (index + 1);

                }


                if (
                    document.getElementById(id)
                ) {

                    id += "-" + index;

                }


                heading.id = id;


                const li =
                    document.createElement("li");


                const link =
                    document.createElement("a");


                link.href = "#" + id;


                link.textContent =
                    heading.textContent;


                if (
                    heading.tagName === "H3"
                ) {

                    link.classList.add(
                        "toc-h3"
                    );

                }


                li.appendChild(link);

                ul.appendChild(li);

            });


            tocList.innerHTML = "";

            tocList.appendChild(ul);

        }


        /* =====================================
           LOAD MARKDOWN
        ====================================== */

        fetch(markdownFile)

            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        "Could not load Lesson Plan.md"
                    );

                }

                return response.text();

            })


            .then(markdown => {

                const content =
                    document.getElementById(
                        "content"
                    );


                /*
                 * Markdown → HTML
                 */

                content.innerHTML =
                    marked.parse(markdown);


                /*
                 * Language Direction
                 */

                applyDirection(content);


                /*
                 * Table of Contents
                 */

                generateTOC();

            })


            .catch(error => {

                document.getElementById(
                    "content"
                ).innerHTML = `

                    <div class="rtl">

                        <h2>
                            خطا در بارگذاری فایل
                        </h2>

                        <p>
                            فایل Lesson Plan.md
                            پیدا نشد یا قابل خواندن نیست.
                        </p>

                    </div>

                `;

                console.error(error);

            });


    </script>


</body>

</html>
