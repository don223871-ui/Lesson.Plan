<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Lesson Plan</title>

    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

</head>


<body>

    <main id="content">
        Loading...
    </main>


    <script>

        fetch("Lesson%20Plan.md")

            .then(response => {

                if (!response.ok) {
                    throw new Error("Could not load Lesson Plan.md");
                }

                return response.text();

            })

            .then(markdown => {

                document.getElementById("content").innerHTML =
                    marked.parse(markdown);

            })

            .catch(error => {

                document.getElementById("content").innerHTML =
                    "<p>Unable to load the lesson plan.</p>";

                console.error(error);

            });

    </script>


</body>

</html>
