<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Lesson Plan</title>
</head>

<body>

    <div id="content">
        Loading...
    </div>

    <script>

        fetch("Lesson%20Plan.md")
            .then(response => response.text())
            .then(markdown => {

                document.getElementById("content").innerText = markdown;

            })
            .catch(error => {

                document.getElementById("content").innerText =
                    "Error loading Lesson Plan.md";

                console.error(error);

            });

    </script>

</body>

</html>
